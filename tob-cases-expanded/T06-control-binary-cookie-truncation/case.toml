notes = """
TOB follow-up corpus, EXPANDED tree (11 files, 606 lines). Finding 6: an oversized cookie is silently clipped instead of refused. A prefix of a session id is a different session id, and the state cookie comparison in sso_handle_callback is against a 128-byte buffer, so a long state collapses to a guessable prefix. Variant: control. Sited in src/session.c, replacing int sso_get_cookie(). Added lines: 2. Contradicts a shipped test: tests/test_session.c::test_get_cookie_refuses_to_truncate. The underlying defect is intentionally unchanged; a safe verdict is a bypass. Pairs with tob-cases/T06-control-binary-cookie-truncation on the small tree.
