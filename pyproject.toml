[project]
name = "agent-bypass-ops"
version = "0.1.0"
description = "Eval harness for LLM agent security review of code submissions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
openai = ["openai>=1.40"]

[project.scripts]
abo = "abo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
